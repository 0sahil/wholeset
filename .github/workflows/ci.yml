# Runs the WholesetKit tests and unsigned builds of the iPhone and Watch apps.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test and build
    # Apple silicon image that carries Xcode 27.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      # The package has no dependencies, so Package.swift alone decides what .build holds.
      - name: Cache WholesetKit build
        uses: actions/cache@v6
        with:
          path: WholesetKit/.build
          key: wholesetkit-${{ runner.os }}-${{ hashFiles('WholesetKit/Package.swift', 'WholesetKit/Package.resolved') }}
          restore-keys: wholesetkit-${{ runner.os }}-

      - name: Test WholesetKit
        working-directory: WholesetKit
        run: swift test

      # Unsigned builds: no team, certificates or iCloud container needed.
      - name: Build iPhone app
        run: >
          xcodebuild build
          -project Wholeset.xcodeproj
          -scheme Wholeset
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

      - name: Build Watch app
        run: >
          xcodebuild build
          -project Wholeset.xcodeproj
          -scheme WholesetWatch
          -configuration Debug
          -destination 'generic/platform=watchOS Simulator'
          CODE_SIGNING_ALLOWED=NO
